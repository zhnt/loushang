[package]
name = "loushang-web"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
loushang-app-client = { path = "../app-client", features = ["frontend"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }

[dev-dependencies]
tempfile = "3"
