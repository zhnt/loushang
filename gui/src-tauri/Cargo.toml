[package]
name = "harness-gui"
version = "0.1.0"
description = "Product-neutral native HarnessGUI shell for Loushang"
authors = ["Loushang Contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "harness_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
fixture-bridge = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
loushang-app-client = { path = "../app-client", features = ["frontend"] }
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10.9"
getrandom = "0.2.17"
tauri-plugin-os = "=2.3.1"
rusqlite = { version = "0.37", features = ["bundled"] }
tempfile = "3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "=0.18.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61.3", features = ["Win32_System_Com", "Win32_UI_Shell"] }
