name: Coding LSP Compatibility

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/coding-lsp-compatibility.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "src/loushang/coding/lsp/**"
      - "src/loushang/coding/sandbox/**"
      - "src/loushang/harness/sandbox/**"
      - "src/loushang/harness/tools/process_hosting/**"
      - "tests/integration/coding/test_gopls_lsp_live.py"
      - "tests/integration/coding/test_pyright_lsp_live.py"
      - "tests/integration/coding/test_rust_analyzer_lsp_live.py"
      - "tests/integration/coding/test_typescript_lsp_live.py"
  pull_request:
    paths:
      - ".github/workflows/coding-lsp-compatibility.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "src/loushang/coding/lsp/**"
      - "src/loushang/coding/sandbox/**"
      - "src/loushang/harness/sandbox/**"
      - "src/loushang/harness/tools/process_hosting/**"
      - "tests/integration/coding/test_gopls_lsp_live.py"
      - "tests/integration/coding/test_pyright_lsp_live.py"
      - "tests/integration/coding/test_rust_analyzer_lsp_live.py"
      - "tests/integration/coding/test_typescript_lsp_live.py"
  workflow_dispatch:

jobs:
  pyright-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: astral-sh/setup-uv@v5

      - name: Install Python dependencies
        run: uv sync --locked --extra dev

      - name: Install pinned Pyright
        run: npm install --global pyright@1.1.411

      - name: Verify real Pyright LSP compatibility
        run: uv run pytest tests/integration/coding/test_pyright_lsp_live.py -q

  typescript-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: astral-sh/setup-uv@v5

      - name: Install Python dependencies
        run: uv sync --locked --extra dev

      - name: Install pinned TypeScript Server
        run: >-
          npm install --global
          typescript-language-server@5.3.0
          typescript@5.9.3

      - name: Verify real TypeScript LSP compatibility
        run: >-
          uv run pytest
          tests/integration/coding/test_typescript_lsp_live.py
          -q

  gopls-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - uses: astral-sh/setup-uv@v5

      - name: Install Python dependencies
        run: uv sync --locked --extra dev

      - name: Install pinned gopls
        run: go install golang.org/x/tools/gopls@v0.23.0

      - name: Verify installed gopls
        run: gopls version

      - name: Verify real gopls compatibility
        run: >-
          uv run pytest
          tests/integration/coding/test_gopls_lsp_live.py
          -q

  rust-analyzer-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5

      - name: Install pinned Rust toolchain and rust-analyzer
        run: >-
          rustup toolchain install 1.97.1
          --profile minimal
          --component rust-analyzer
          --component rust-src

      - name: Select pinned Rust toolchain
        run: rustup default 1.97.1

      - name: Verify installed rust-analyzer
        run: rust-analyzer --version

      - name: Install Python dependencies
        run: uv sync --locked --extra dev

      - name: Verify real rust-analyzer compatibility
        run: >-
          uv run pytest
          tests/integration/coding/test_rust_analyzer_lsp_live.py
          -q
