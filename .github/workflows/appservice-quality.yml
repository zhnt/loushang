name: AppService Quality

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  appservice-quality:
    name: appservice-quality-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Check G11 hosted application
        run: make check-appservice
