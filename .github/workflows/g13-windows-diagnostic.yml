name: G13 Windows Diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  isolate-g13-windows:
    name: isolate-${{ matrix.slice }}
    runs-on: windows-2022
    timeout-minutes: 4
    strategy:
      fail-fast: false
      matrix:
        include:
          - slice: live-owner
            targets: tests/appservice/test_continuity.py::test_G13_LEASE_FENCE_excludes_a_second_live_owner
          - slice: crash-release
            targets: tests/appservice/test_continuity.py::test_G13_LEASE_FENCE_process_death_releases_the_os_lock
          - slice: store-data
            targets: tests/appservice/test_continuity.py
            select: and not LEASE_FENCE
          - slice: service-runtime
            targets: tests/appservice/test_continuity_runtime.py
          - slice: product-runtime
            targets: tests/apphost/test_continuity.py tests/coding/test_hosted_application.py
          - slice: architecture
            targets: tests/architecture/test_durable_hosted_application_continuity_g13.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Isolate G13 ${{ matrix.slice }}
        shell: pwsh
        run: >-
          uv run --extra dev python scripts/dev/run_pytest.py
          ${{ matrix.targets }}
          -k "G13 ${{ matrix.select }}"
          -vv -o faulthandler_timeout=30
