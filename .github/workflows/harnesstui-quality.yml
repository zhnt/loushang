name: Harnesstui Quality

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  harnesstui-quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: make bootstrap

      - name: Harnesstui quality gate
        run: make check-harnesstui
