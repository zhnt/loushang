name: Change-aware Quality

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 20 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: quality-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.select.outputs.plan }}
      reused_run: ${{ steps.reuse.outputs.reused_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select checks and explain scope
        id: select
        run: python scripts/ci/select_checks.py --event
      - name: Reuse successful PR evidence on an identical merge push
        id: reuse
        env:
          CI_PLAN: ${{ steps.select.outputs.plan }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci/reuse_pr_gate.py
      - name: Lightweight documentation invariants and changed links
        env:
          CI_PLAN: ${{ steps.select.outputs.plan }}
        run: python scripts/ci/check_docs.py --plan-env
      - name: Verify routing and fail-closed aggregation
        if: ${{ fromJSON(steps.select.outputs.plan).checks.ci }}
        run: python -m unittest discover -s tests/ci -v
      - uses: actions/setup-go@v5
        if: ${{ fromJSON(steps.select.outputs.plan).checks.ci }}
        with:
          go-version: "1.26.0"
          cache: false
      - name: Validate Actions syntax
        if: ${{ fromJSON(steps.select.outputs.plan).checks.ci }}
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck=""

  architecture:
    needs: changes
    if: ${{ needs.changes.outputs.reused_run == '' && fromJSON(needs.changes.outputs.plan).workflows['architecture'] }}
    uses: ./.github/workflows/architecture-quality.yml
    with:
      plan: ${{ needs.changes.outputs.plan }}

  gui:
    needs: changes
    if: ${{ needs.changes.outputs.reused_run == '' && fromJSON(needs.changes.outputs.plan).workflows['gui'] }}
    uses: ./.github/workflows/gui-quality.yml
    with:
      plan: ${{ needs.changes.outputs.plan }}

  units:
    needs: changes
    if: ${{ needs.changes.outputs.reused_run == '' && fromJSON(needs.changes.outputs.plan).workflows['units'] }}
    uses: ./.github/workflows/package-unit-quality.yml
    with:
      plan: ${{ needs.changes.outputs.plan }}

  e2e:
    needs: changes
    if: ${{ needs.changes.outputs.reused_run == '' && fromJSON(needs.changes.outputs.plan).workflows['e2e'] }}
    uses: ./.github/workflows/e2e-smoke-quality.yml
    with:
      plan: ${{ needs.changes.outputs.plan }}

  ai:
    needs: changes
    if: ${{ needs.changes.outputs.reused_run == '' && fromJSON(needs.changes.outputs.plan).workflows['ai'] }}
    uses: ./.github/workflows/ai-quality.yml
    with:
      plan: ${{ needs.changes.outputs.plan }}

  harness:
    needs: changes
    if: ${{ needs.changes.outputs.reused_run == '' && fromJSON(needs.changes.outputs.plan).workflows['harness'] }}
    uses: ./.github/workflows/harness-quality.yml
    with:
      plan: ${{ needs.changes.outputs.plan }}

  harnesstui:
    needs: changes
    if: ${{ needs.changes.outputs.reused_run == '' && fromJSON(needs.changes.outputs.plan).workflows['harnesstui'] }}
    uses: ./.github/workflows/harnesstui-quality.yml
    with:
      plan: ${{ needs.changes.outputs.plan }}

  tui:
    needs: changes
    if: ${{ needs.changes.outputs.reused_run == '' && fromJSON(needs.changes.outputs.plan).workflows['tui'] }}
    uses: ./.github/workflows/tui-render-contract.yml
    with:
      plan: ${{ needs.changes.outputs.plan }}

  hosting:
    needs: changes
    if: ${{ needs.changes.outputs.reused_run == '' && fromJSON(needs.changes.outputs.plan).workflows['hosting'] }}
    uses: ./.github/workflows/hosting-quality.yml
    with:
      plan: ${{ needs.changes.outputs.plan }}

  apphost:
    needs: changes
    if: ${{ needs.changes.outputs.reused_run == '' && fromJSON(needs.changes.outputs.plan).workflows['apphost'] }}
    uses: ./.github/workflows/apphost-quality.yml
    with:
      plan: ${{ needs.changes.outputs.plan }}

  appservice:
    needs: changes
    if: ${{ needs.changes.outputs.reused_run == '' && fromJSON(needs.changes.outputs.plan).workflows['appservice'] }}
    uses: ./.github/workflows/appservice-quality.yml
    with:
      plan: ${{ needs.changes.outputs.plan }}

  host-runtime:
    needs: changes
    if: ${{ needs.changes.outputs.reused_run == '' && fromJSON(needs.changes.outputs.plan).workflows['host-runtime'] }}
    uses: ./.github/workflows/host-runtime-quality.yml
    with:
      plan: ${{ needs.changes.outputs.plan }}

  windows-shell:
    needs: changes
    if: ${{ needs.changes.outputs.reused_run == '' && fromJSON(needs.changes.outputs.plan).workflows['windows-shell'] }}
    uses: ./.github/workflows/windows-shell-compatibility.yml
    with:
      plan: ${{ needs.changes.outputs.plan }}

  worker-reboot:
    needs: changes
    if: ${{ needs.changes.outputs.reused_run == '' && fromJSON(needs.changes.outputs.plan).workflows['worker-reboot'] }}
    uses: ./.github/workflows/worker-registered-reboot-drill.yml
    with:
      plan: ${{ needs.changes.outputs.plan }}

  lsp:
    needs: changes
    if: ${{ needs.changes.outputs.reused_run == '' && fromJSON(needs.changes.outputs.plan).workflows['lsp'] }}
    uses: ./.github/workflows/coding-lsp-compatibility.yml
    with:
      plan: ${{ needs.changes.outputs.plan }}

  quality-gate:
    name: quality-gate
    if: always()
    needs: [changes, architecture, gui, units, e2e, ai, harness, harnesstui, tui, hosting, apphost, appservice, host-runtime, windows-shell, worker-reboot, lsp]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require every selected workflow
        env:
          CI_PLAN: ${{ needs.changes.outputs.plan }}
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_REUSED_RUN: ${{ needs.changes.outputs.reused_run }}
        run: >-
          python scripts/ci/verify_gate.py --section workflows --require-changes
          --jobs '{"architecture":"architecture","gui":"gui","units":"units","e2e":"e2e","ai":"ai","harness":"harness","harnesstui":"harnesstui","tui":"tui","hosting":"hosting","apphost":"apphost","appservice":"appservice","host-runtime":"host-runtime","windows-shell":"windows-shell","worker-reboot":"worker-reboot","lsp":"lsp"}'
      - name: Record actual tested tree and execution plan
        if: ${{ github.event_name == 'pull_request' && (fromJSON(needs.changes.outputs.plan).e2e || fromJSON(needs.changes.outputs.plan).workflows.units) }}
        continue-on-error: true
        env:
          CI_PLAN: ${{ needs.changes.outputs.plan }}
        run: python scripts/ci/reuse_pr_gate.py --record
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'pull_request' && (fromJSON(needs.changes.outputs.plan).e2e || fromJSON(needs.changes.outputs.plan).workflows.units) }}
        continue-on-error: true
        with:
          name: pr-quality-evidence
          overwrite: true
          path: pr-quality-evidence.json
          if-no-files-found: error
          retention-days: 7
