name: AI Quality

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read

jobs:
  install-compatibility:
    if: ${{ fromJSON(inputs.plan).checks.install }}
    name: Install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            architecture: x86_64
          - os: macos-15
            architecture: arm64
          - os: ubuntu-latest
            architecture: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5

      - name: Verify runner architecture
        run: test "$(uname -m)" = "${{ matrix.architecture }}"

      - name: Install
        run: uv sync --locked --no-build-package cryptography

  ai-quality:
    if: ${{ fromJSON(inputs.plan).checks.ai }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: make bootstrap

      - name: AI quality gate
        run: make check-ai

  selected-checks:
    name: Selected checks
    if: always()
    needs: [install-compatibility, ai-quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify selected jobs
        env:
          CI_PLAN: ${{ inputs.plan }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: >-
          python scripts/ci/verify_gate.py
          --jobs '{"install-compatibility":"install","ai-quality":"ai"}'
