name: HarnessGUI Quality

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read

jobs:
  gui:
    if: ${{ fromJSON(inputs.plan).checks.gui }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - run: npm install --global pnpm@11.19.0
      - run: pnpm --dir gui install --frozen-lockfile
      - name: Offline GUI checks
        run: pnpm --dir gui run check
