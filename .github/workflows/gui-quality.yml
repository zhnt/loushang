name: HarnessGUI Quality

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read

jobs:
  gui:
    if: ${{ fromJSON(inputs.plan).checks.gui }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: gui/.node-version
      - run: npm install --global npm@11
      - run: npm --prefix gui ci
      - name: Offline GUI checks
        run: npm --prefix gui run check
