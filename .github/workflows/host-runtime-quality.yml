name: Host Runtime Quality

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read

jobs:
  host-runtime-quality:
    if: ${{ fromJSON(inputs.plan).checks.host_runtime }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: make bootstrap

      - name: Host runtime tests
        env:
          CI_PLAN: ${{ inputs.plan }}
        run: uv run python scripts/ci/run_checks.py host_runtime

  selected-checks:
    name: Selected checks
    if: always()
    needs: [host-runtime-quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify selected jobs
        env:
          CI_PLAN: ${{ inputs.plan }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: >-
          python scripts/ci/verify_gate.py
          --jobs '{"host-runtime-quality":"host_runtime"}'
