name: Host Runtime Quality

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read

jobs:
  host-runtime-quality:
    if: ${{ fromJSON(inputs.plan).checks.host_runtime }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: make bootstrap

      - name: Host runtime tests
        env:
          CI_PLAN: ${{ inputs.plan }}
        run: |
          mkdir -p .artifacts
          uv run python scripts/ci/run_checks.py host_runtime

      - name: Reject empty, skipped, or failing PR host runtime smoke
        if: ${{ fromJSON(inputs.plan).host_runtime_smoke }}
        run: >-
          uv run python scripts/dev/verify_pytest_xml.py
          .artifacts/host-runtime-pr-smoke.xml
