name: macOS Intel Package

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag or commit to build
        type: string
        default: lane/gui
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: true

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: macos-15-intel
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose installed launchd control
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 44270718283 -n loushang-macos12-intel -D "$RUNNER_TEMP/package"
          sudo installer -pkg "$(find "$RUNNER_TEMP/package" -name '*.pkg' -print -quit)" -target /
          export LOUSHANG_HOME="$RUNNER_TEMP/diagnostic-home"
          mkdir -m 700 "$LOUSHANG_HOME"
          /Applications/loushang-gui.app/Contents/Resources/runtime/bin/python3 -I - <<'PY'
          import os, plistlib, subprocess
          from pathlib import Path
          from loushang.coding import macos_service as service
          original = service._launchctl
          def traced(*args):
              result = original(*args)
              if result.returncode:
                  print('launchctl', args, '=>', result.returncode, result.stderr, flush=True)
              return result
          service._launchctl = traced
          identity = service._identity
          write = service._write_agent
          for domain, session in [('user', 'Background'), ('gui', None)]:
              print('CASE', domain, session, flush=True)
              home = Path(os.environ['LOUSHANG_HOME']) / domain
              service.resolve_platform_home = lambda: home
              def identify(home):
                  label, _ = identity(home)
                  return label, f'{domain}/{os.getuid()}/{label}'
              def agent(home, label):
                  path = write(home, label)
                  value = plistlib.loads(path.read_bytes())
                  if session:
                      value['LimitLoadToSessionType'] = session
                  path.write_bytes(plistlib.dumps(value))
                  return path
              service._identity = identify
              service._write_agent = agent
              try:
                  print(service.control_launchd_service('start', None), flush=True)
              except Exception as error:
                  print(type(error).__name__, str(error), flush=True)
                  subprocess.run(['sudo', 'log', 'show', '--last', '1m', '--style', 'compact', '--predicate', 'process == "launchd" AND eventMessage CONTAINS "ai.loushang"'])
              finally:
                  print(service.control_launchd_service('stop', None), flush=True)
                  log = home / 'state/macos-host/host.log'
                  if log.exists():
                      print(log.read_text(), flush=True)
          PY
          sudo /Applications/loushang-gui.app/Contents/Resources/runtime/bin/python3 -I - <<'PY'
          from pathlib import Path
          path = Path('/Applications/loushang-gui.app/Contents/Resources/runtime/lib/python3.11/site-packages/loushang/coding/macos_service.py')
          path.write_text(path.read_text().replace('"RunAtLoad": True,', '"LimitLoadToSessionType": "Background", "RunAtLoad": True,'))
          PY
          /Applications/loushang-gui.app/Contents/Resources/runtime/bin/python3 -I - <<'PY'
          from pathlib import Path
          path = Path('scripts/gui/check_macos_package.py')
          path.write_text(path.read_text().replace('["/usr/local/bin/loushang-web"]', '[str(BIN / "loushang-web")]'))
          PY
          /Applications/loushang-gui.app/Contents/Resources/runtime/bin/python3 -I scripts/gui/check_macos_package.py --evidence "$RUNNER_TEMP/evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-launchd-diagnostic
          path: ${{ runner.temp }}/evidence
  package:
    if: ${{ false }}
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      RUSTUP_TOOLCHAIN: "1.98.1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - name: Verify Intel build host
        run: test "$(uname -m)" = x86_64
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Prepare pinned Python and Rust
        run: |
          uv python install 3.11.15
          rustup toolchain install 1.98.1 --profile minimal
          rustup target add --toolchain 1.98.1 x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            gui/src-tauri -> target
            gui/web -> target
          key: macos12-intel
          cache-on-failure: true
      - name: Build full installation package
        run: uv run --no-project --python 3.11 python scripts/gui/build_macos_full.py
      - name: Install and verify packaged applications
        run: |
          sudo /usr/sbin/installer -pkg "$(find dist/macos-full -maxdepth 1 -name '*.pkg' -print -quit)" -target /
          mv gui/dist "$RUNNER_TEMP/loushang-source-assets"
          uv run --no-project --python 3.11 python scripts/gui/check_macos_package.py --evidence dist/macos-full/evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loushang-macos12-intel
          path: dist/macos-full/
          if-no-files-found: error
          retention-days: 14
