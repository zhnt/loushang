name: Architecture Quality

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read

jobs:
  docs:
    if: ${{ fromJSON(inputs.plan).checks.docs }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Save change plan
        env:
          CI_PLAN: ${{ inputs.plan }}
        run: |
          mkdir -p .artifacts
          python -c "import os, pathlib; pathlib.Path('.artifacts/check-plan.json').write_text(os.environ['CI_PLAN'])"
      - name: Lightweight documentation invariants and changed links
        run: python scripts/ci/check_docs.py --plan .artifacts/check-plan.json

  source-facts:
    if: ${{ fromJSON(inputs.plan).checks.architecture }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --extra dev
      - name: Architecture tooling lint
        run: uv run ruff check scripts/architecture/render_current_package_dependencies.py tests/architecture/test_architecture_documentation.py
      - name: Verify source dependency facts once
        run: uv run python scripts/architecture/render_current_package_dependencies.py --check

  selected-checks:
    name: Selected checks
    if: always()
    needs: [docs, source-facts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify selected jobs
        env:
          CI_PLAN: ${{ inputs.plan }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: >-
          python scripts/ci/verify_gate.py
          --jobs '{"docs":"docs","source-facts":"architecture"}'
