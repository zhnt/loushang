name: Harness Quality

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  linux-harness:
    name: Linux harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5

      - name: Install PLC9B Linux native isolation dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install dependencies
        run: make bootstrap

      - name: Create PLC9B report directory
        run: uv run python -c "from pathlib import Path; Path('.artifacts').mkdir(exist_ok=True)"

      - name: PLC9B Linux native adversarial gate (plc9b-linux-native)
        env:
          PYTEST_ADDOPTS: >-
            -o faulthandler_timeout=60
            --junitxml=.artifacts/plc9b-linux-native.xml
        run: >-
          uv run python scripts/dev/run_pytest.py
          tests/harness/resources/packages/test_plc9b_adversarial.py
          -q

      - name: Reject skipped or failing PLC9B manifest cases
        run: >-
          uv run python scripts/dev/verify_pytest_xml.py
          .artifacts/plc9b-linux-native.xml

      - name: Upload PLC9B Linux native report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plc9b-linux-native-pytest-report
          path: .artifacts/plc9b-linux-native.xml
          if-no-files-found: error

      - name: PLC9C5 C5.1 receipt and lifecycle contract
        env:
          PYTEST_ADDOPTS: >-
            -o faulthandler_timeout=60
            --junitxml=.artifacts/plc9c5-c51-contract.xml
        run: >-
          uv run python scripts/dev/run_pytest.py
          tests/harness/worker/test_product_activation.py
          -q

      - name: Reject skipped, failing, or incomplete PLC9C5 C5.1 evidence
        run: |
          uv run python scripts/dev/verify_pytest_xml.py \
            .artifacts/plc9c5-c51-contract.xml
          uv run python scripts/dev/verify_plc9c5_manifest.py \
            docs/internals/architecture/harness/plugin/plugin-lifecycle-plc9c5-evidence-manifest.json \
            PLC9C5-C5.1-CONTRACT \
            .artifacts/plc9c5-c51-contract.xml

      - name: Upload PLC9C5 C5.1 contract report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plc9c5-c51-contract-pytest-report
          path: .artifacts/plc9c5-c51-contract.xml
          if-no-files-found: error

      - name: PLC9C5 C5.2 Linux native profile binding
        env:
          PYTEST_ADDOPTS: >-
            -o faulthandler_timeout=60
            --junitxml=.artifacts/plc9c5-c52-linux-native.xml
        run: >-
          uv run python scripts/dev/run_pytest.py
          tests/harness/worker/test_native_profile_bridge.py
          -q

      - name: Reject skipped, failing, or incomplete PLC9C5 C5.2 evidence
        run: |
          uv run python scripts/dev/verify_pytest_xml.py \
            .artifacts/plc9c5-c52-linux-native.xml
          uv run python scripts/dev/verify_plc9c5_manifest.py \
            docs/internals/architecture/harness/plugin/plugin-lifecycle-plc9c5-evidence-manifest.json \
            PLC9C5-C5.2-LINUX-NATIVE \
            .artifacts/plc9c5-c52-linux-native.xml

      - name: Upload PLC9C5 C5.2 Linux native report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plc9c5-c52-linux-native-pytest-report
          path: .artifacts/plc9c5-c52-linux-native.xml
          if-no-files-found: error

      - name: Harness quality gate
        run: make check-harness

  macos-exec:
    name: macOS local exec contract
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Create report directory
        run: uv run python -c "from pathlib import Path; Path('.artifacts').mkdir(exist_ok=True)"

      - name: Run local exec contract
        env:
          PYTEST_ADDOPTS: >-
            -o faulthandler_timeout=60
            --junitxml=.artifacts/macos-local-exec.xml
        run: uv run python scripts/dev/run_pytest.py tests/harness/workspace/test_exec.py -q

      - name: Reject empty, skipped, or failing report
        run: uv run python scripts/dev/verify_pytest_xml.py .artifacts/macos-local-exec.xml

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-local-exec-pytest-report
          path: .artifacts/macos-local-exec.xml
          if-no-files-found: warn

  harness-quality:
    name: harness-quality
    if: always()
    needs:
      - linux-harness
      - macos-exec
    runs-on: ubuntu-latest
    steps:
      - name: Require Linux and macOS contracts
        env:
          LINUX_RESULT: ${{ needs.linux-harness.result }}
          MACOS_RESULT: ${{ needs.macos-exec.result }}
        run: >-
          python -c "import os, sys;
          results = {'linux': os.environ['LINUX_RESULT'], 'macos': os.environ['MACOS_RESULT']};
          print(results);
          sys.exit(0 if all(value == 'success' for value in results.values()) else 1)"
