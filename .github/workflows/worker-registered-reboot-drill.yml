name: Registered Worker Reboot Drill

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read

jobs:
  isolated-linux-reboot:
    if: ${{ fromJSON(inputs.plan).checks.registered_reboot }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare registered Worker and recover after guest OS reboot
        run: bash scripts/dev/worker_registered_qemu_reboot_drill.sh
      - name: Upload reboot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registered-worker-real-reboot-evidence
          path: .artifacts/registered-reboot-vm/
          if-no-files-found: warn

  selected-checks:
    name: Selected checks
    if: always()
    needs: [isolated-linux-reboot]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify selected jobs
        env:
          CI_PLAN: ${{ inputs.plan }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: >-
          python scripts/ci/verify_gate.py
          --jobs '{"isolated-linux-reboot":"registered_reboot"}'
