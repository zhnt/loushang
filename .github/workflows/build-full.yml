name: Build Full Package
run-name: Build ${{ inputs.target }} from ${{ inputs.source_ref }}

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or commit to package
        type: string
        required: true
        default: main
      target:
        description: Full package target
        type: choice
        required: true
        options:
          - linux-x86_64-deb
          - linux-aarch64-deb
          - windows-x86_64-nsis
          - windows-x86_64-msi
          - macos-x86_64-pkg
          - macos-aarch64-pkg
          - all

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.matrix.outputs.sha }}
      include: ${{ steps.matrix.outputs.include }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - name: Resolve source and native build targets
        id: matrix
        env:
          PACKAGE_TARGET: ${{ inputs.target }}
        run: |
          test -f scripts/build/build_full_linux.py || {
            echo "::error::Select a source revision that contains scripts/build."
            exit 1
          }
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import json
          import os

          runners = {
              "linux-x86_64-deb": "ubuntu-24.04",
              "linux-aarch64-deb": "ubuntu-24.04-arm",
              "windows-x86_64-nsis": "windows-2022",
              "windows-x86_64-msi": "windows-2022",
              "macos-x86_64-pkg": "macos-15-intel",
              "macos-aarch64-pkg": "macos-15",
          }
          selected = os.environ["PACKAGE_TARGET"]
          targets = runners if selected == "all" else [selected]
          entries = []
          for target in targets:
              system, arch, format = target.split("-")
              entries.append(dict(target=target, runner=runners[target], system=system,
                                  arch=arch, format=format))
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print("include=" + json.dumps(entries), file=output)
          PY

  package:
    needs: resolve
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.include) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: gui/.node-version
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - run: npm install --global npm@11
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: rustup toolchain install 1.98.1 --profile minimal
      - name: Install Ubuntu build dependencies
        if: matrix.system == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential desktop-file-utils dpkg-dev file \
            libayatana-appindicator3-dev libssl-dev librsvg2-dev libwebkit2gtk-4.1-dev \
            libxdo-dev pkg-config xdg-utils
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            gui/src-tauri -> target
            gui/web -> target
          key: ${{ matrix.target }}
      - name: Build Full installer
        run: >-
          uv run --no-project --python 3.11 python scripts/build/build_full_${{ matrix.system }}.py
          --arch ${{ matrix.arch }} --format ${{ matrix.format }}
      - uses: actions/upload-artifact@v4
        with:
          name: loushang-${{ matrix.target }}-${{ needs.resolve.outputs.sha }}
          path: dist/packages/
          if-no-files-found: error
          retention-days: 14
