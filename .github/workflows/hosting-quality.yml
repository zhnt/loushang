name: Hosting Quality

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read

jobs:
  hosting-quality:
    if: ${{ fromJSON(inputs.plan).checks.hosting }}
    name: hosting-quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            backend: posix-process-group-v1
            endpoint: posix-socketpair-v1
          - os: macos-15
            backend: posix-process-group-v1
            endpoint: posix-socketpair-v1
          - os: windows-2022
            backend: windows-job-v1
            endpoint: windows-anonymous-pipes-v1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Lint Hosting H0-H6
        run: >-
          uv run --extra dev ruff check
          src/loushang/hosting
          src/loushang/harness/workspace/process/hosting_compat.py
          src/loushang/harness/worker/__init__.py
          src/loushang/harness/worker/_native_profile_bridge.py
          src/loushang/harness/worker/hosting_adapter.py
          src/loushang/harness/worker/owner_selection.py
          src/loushang/harness/worker/session.py
          src/loushang/harness/worker/supervisor.py
          src/loushang/coding/package_product_worker_native_release.py
          src/loushang/coding/package_product_worker_native_approval.py
          src/loushang/coding/package_product_worker_installed_native.py
          src/loushang/coding/package_product_worker_native_install.py
          src/loushang/coding/cli/package_worker_native.py
          src/loushang/coding/package_product_worker_payload.py
          src/loushang/coding/package_product_worker_start_gate.py
          src/loushang/coding/package_product_worker_start_gate_journal.py
          src/loushang/coding/package_product_worker_start_gate_recovery.py
          src/loushang/coding/package_product_worker_cleanup_evidence.py
          src/loushang/coding/package_product_worker_crash_c5_settlement.py
          src/loushang/harness/resources/packages/product_epoch_guard.py
          src/loushang/coding/package_product_worker_capability.py
          src/loushang/coding/package_product_worker_provider.py
          src/loushang/coding/package_product_worker_provider_host.py
          src/loushang/coding/package_product_worker_session_composition.py
          src/loushang/coding/package_product_worker_policy.py
          src/loushang/coding/package_product_worker_receipt.py
          src/loushang/plugin/__init__.py
          src/loushang/plugin/__main__.py
          src/loushang/plugin/_coding_local_worker_wheel.py
          scripts/dev/build_posix_containment_launcher.py
          scripts/dev/build_posix_native_release_wheel.py
          tests/hosting
          tests/coding/test_package_worker_candidate_wheel.py
          tests/coding/test_package_worker_native_cli.py
          tests/harness/workspace/process/test_hosting_compat.py
          tests/harness/worker/test_hosting_adapter.py
          tests/harness/worker/test_native_profile_bridge.py
          tests/architecture/test_hosting_h0_contract.py
          tests/architecture/test_hosting_h1_process_lifetime.py
          tests/architecture/test_hosting_h2_platform_contract.py
          tests/architecture/test_hosting_h3_endpoint.py
          tests/architecture/test_hosting_h4_child_session.py
          tests/architecture/test_hosting_h5_worker_adapter.py
          tests/architecture/test_hosting_h6_launch_preparation.py
          tests/architecture/test_hosting_h6_harness_parity.py
          tests/architecture/test_hosting_h6_posix_native.py
          tests/architecture/test_hosting_h6_windows_native.py
          tests/architecture/test_hosted_product_runtime_v1_baseline.py
          tests/architecture/test_plugin_lifecycle_plc9c5_c50_baseline.py
          tests/architecture/test_plugin_lifecycle_plc9c5_c52_linux_native.py
          tests/architecture/test_plugin_lifecycle_plc9c5_c53_windows_mechanics.py
          tests/architecture/test_plugin_lifecycle_plc9c5_c54_linux_product.py
          tests/architecture/test_plugin_lifecycle_plc9c5_c55_windows_containment.py
          tests/architecture/test_hosting_h65_windows_lpac_design.py
          tests/architecture/test_hosting_architecture_baseline.py

      # The shared set contains Linux-only Worker owners even on other runners.
      # Check their declared platform instead of the runner's typeshed.
      - name: Typecheck Hosting H0-H6
        run: >-
          uv run --extra dev mypy --platform linux --follow-imports=silent
          src/loushang/hosting
          src/loushang/harness/workspace/process/hosting_compat.py
          src/loushang/harness/worker/__init__.py
          src/loushang/harness/worker/_native_profile_bridge.py
          src/loushang/harness/worker/hosting_adapter.py
          src/loushang/harness/worker/owner_selection.py
          src/loushang/harness/worker/session.py
          src/loushang/harness/worker/supervisor.py
          src/loushang/coding/package_product_worker_payload.py
          src/loushang/coding/package_product_worker_start_gate.py
          src/loushang/coding/package_product_worker_start_gate_journal.py
          src/loushang/coding/package_product_worker_start_gate_recovery.py
          src/loushang/coding/package_product_worker_cleanup_evidence.py
          src/loushang/coding/package_product_worker_crash_c5_settlement.py
          src/loushang/harness/resources/packages/product_epoch_guard.py
          src/loushang/coding/package_product_worker_native_approval.py
          src/loushang/coding/package_product_worker_native_release.py
          src/loushang/coding/package_product_worker_installed_native.py
          src/loushang/coding/package_product_worker_native_install.py
          src/loushang/coding/cli/package_worker_native.py
          src/loushang/coding/package_product_worker_capability.py
          src/loushang/coding/package_product_worker_provider.py
          src/loushang/coding/package_product_worker_provider_host.py
          src/loushang/coding/package_product_worker_session_composition.py
          src/loushang/coding/package_product_worker_policy.py
          src/loushang/coding/package_product_worker_receipt.py
          src/loushang/plugin/__init__.py
          src/loushang/plugin/__main__.py
          src/loushang/plugin/_coding_local_worker_wheel.py

      - name: Typecheck Windows native owners
        if: matrix.os == 'windows-2022'
        shell: pwsh
        run: |
          $files = @(
            Get-ChildItem src/loushang/hosting -File | Where-Object {
              $_.Name -like '_windows_*.py' -or
              $_.Name -eq '_win32_process.py' -or
              $_.Name -eq 'windows_backend_material.py'
            }
            Get-ChildItem src/loushang/coding -File | Where-Object {
              $_.Name -like 'package_product_worker_windows_*.py' -or
              $_.Name -like 'package_private_data_windows_*.py'
            }
          ) | Select-Object -ExpandProperty FullName
          uv run --extra dev mypy --platform win32 --follow-imports=skip @files

      - name: Create H6.2 native report directory
        if: matrix.os == 'ubuntu-24.04'
        run: uv run python -c "from pathlib import Path; Path('.artifacts').mkdir(exist_ok=True)"

      - name: H6.2 Linux native adversarial gate
        if: matrix.os == 'ubuntu-24.04'
        env:
          PYTEST_ADDOPTS: >-
            -o faulthandler_timeout=60
            --junitxml=.artifacts/h6-posix-native.xml
        run: >-
          uv run --extra dev python scripts/dev/run_pytest.py
          tests/hosting/test_posix_launch_preparation.py
          tests/hosting/test_posix_release_launcher.py
          "tests/coding/test_package_worker_candidate_wheel.py::test_worker_source_catalog_pins_explicit_product_candidate[built-release]"
          "tests/coding/test_package_worker_candidate_wheel.py::test_worker_source_catalog_pins_explicit_product_candidate[installed-release]"
          "tests/coding/test_package_worker_candidate_wheel.py::test_worker_source_catalog_pins_explicit_product_candidate[repaired-release]"
          "tests/coding/test_package_worker_candidate_wheel.py::test_worker_source_catalog_pins_explicit_product_candidate[installed-protocol]"
          "tests/coding/test_package_worker_candidate_wheel.py::test_worker_source_catalog_pins_explicit_product_candidate[installed-graph-failure]"
          "tests/coding/test_package_worker_candidate_wheel.py::test_worker_source_catalog_pins_explicit_product_candidate[installed-revocation]"
          "tests/coding/test_package_worker_candidate_wheel.py::test_worker_source_catalog_pins_explicit_product_candidate[installed-expiry]"
          tests/coding/test_package_worker_candidate_wheel.py::test_worker_candidate_author_recipe_is_reproducible_and_no_replace
          tests/coding/test_package_worker_candidate_wheel.py::test_windows_worker_candidate_author_recipe_is_inert_offline
          "tests/coding/test_package_worker_candidate_wheel.py::test_explicit_worker_wheel_reaches_real_product_transaction[valid]"
          "tests/coding/test_package_worker_candidate_wheel.py::test_explicit_worker_wheel_reaches_real_product_transaction[dependency]"
          "tests/coding/test_package_worker_candidate_wheel.py::test_explicit_worker_wheel_reaches_real_product_transaction[dependency_two]"
          "tests/coding/test_package_worker_candidate_wheel.py::test_explicit_worker_wheel_reaches_real_product_transaction[dependency_two_nonpure]"
          "tests/coding/test_package_worker_candidate_wheel.py::test_explicit_worker_wheel_reaches_real_product_transaction[dependency_nonpure]"
          "tests/coding/test_package_worker_candidate_wheel.py::test_explicit_worker_wheel_reaches_real_product_transaction[dependency_extra_executable]"
          tests/coding/test_package_worker_candidate_wheel.py::test_empty_worker_payload_debt_requires_absent_supervisor_claim
          tests/coding/test_package_worker_candidate_wheel.py::test_complete_worker_payload_repair_resumes_partial_deletion
          tests/coding/test_package_worker_candidate_wheel.py::test_unmarked_worker_payload_review_is_bounded_and_read_only
          tests/coding/test_package_worker_candidate_wheel.py::test_unmarked_worker_payload_repair_resumes_exact_partial_deletion
          tests/coding/test_package_worker_native_cli.py
          -q

      - name: Reject empty, skipped, or failing H6.2 native report
        if: matrix.os == 'ubuntu-24.04'
        run: >-
          uv run python scripts/dev/verify_pytest_xml.py
          .artifacts/h6-posix-native.xml

      - name: Upload H6.2 Linux native report
        if: always() && matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v4
        with:
          name: h6-posix-native-pytest-report
          path: .artifacts/h6-posix-native.xml
          if-no-files-found: error

      - name: Create H6.3 native report directory
        if: matrix.os == 'windows-2022'
        run: uv run python -c "from pathlib import Path; Path('.artifacts').mkdir(exist_ok=True)"

      - name: H6.3 Windows native adversarial gate
        if: matrix.os == 'windows-2022'
        env:
          PYTEST_ADDOPTS: >-
            -o faulthandler_timeout=60
            --junitxml=.artifacts/h6-windows-native.xml
        run: >-
          uv run --extra dev python scripts/dev/run_pytest.py
          tests/hosting/test_windows_launch_preparation_native.py
          tests/hosting/test_windows_backend_material_native.py
          -q

      - name: Reject empty, skipped, or failing H6.3 native report
        if: matrix.os == 'windows-2022'
        run: >-
          uv run python scripts/dev/verify_pytest_xml.py
          .artifacts/h6-windows-native.xml

      - name: Upload H6.3 Windows native report
        if: always() && matrix.os == 'windows-2022'
        uses: actions/upload-artifact@v4
        with:
          name: h6-windows-native-pytest-report
          path: .artifacts/h6-windows-native.xml
          if-no-files-found: error

      - name: PLC9C5 C5.3 Windows mechanics and rejection gate
        if: matrix.os == 'windows-2022'
        env:
          LOUSHANG_PLC9C5_C53_REPORT: "1"
          PYTEST_ADDOPTS: >-
            -o faulthandler_timeout=60
            --junitxml=.artifacts/plc9c5-c53-windows-mechanics.xml
        run: >-
          uv run --extra dev python scripts/dev/run_pytest.py
          tests/hosting/test_plc9c5_c53_windows_mechanics.py
          -q

      - name: Reject skipped, failing, or incomplete PLC9C5 C5.3 evidence
        if: matrix.os == 'windows-2022'
        run: |
          uv run python scripts/dev/verify_pytest_xml.py .artifacts/plc9c5-c53-windows-mechanics.xml
          uv run python scripts/dev/verify_plc9c5_manifest.py docs/internals/architecture/harness/plugin/plugin-lifecycle-plc9c5-evidence-manifest.json PLC9C5-C5.3-WINDOWS-MECHANICS .artifacts/plc9c5-c53-windows-mechanics.xml

      - name: Upload PLC9C5 C5.3 Windows mechanics report
        if: always() && matrix.os == 'windows-2022'
        uses: actions/upload-artifact@v4
        with:
          name: plc9c5-c53-windows-mechanics-pytest-report
          path: .artifacts/plc9c5-c53-windows-mechanics.xml
          if-no-files-found: error

      - name: PLC9C5 C5.5b Windows LPAC native containment gate
        if: matrix.os == 'windows-2022'
        env:
          LOUSHANG_PLC9C5_C55B_REPORT: "1"
          PYTEST_ADDOPTS: >-
            -o faulthandler_timeout=60
            --junitxml=.artifacts/plc9c5-c55b-windows-lpac-native.xml
        run: >-
          uv run --extra dev python scripts/dev/run_pytest.py
          tests/hosting/test_plc9c5_c55b_windows_lpac_native.py
          -q

      - name: Reject skipped, failing, or incomplete PLC9C5 C5.5b evidence
        if: matrix.os == 'windows-2022'
        run: |
          uv run python scripts/dev/verify_pytest_xml.py .artifacts/plc9c5-c55b-windows-lpac-native.xml
          uv run python scripts/dev/verify_plc9c5_manifest.py docs/internals/architecture/harness/plugin/plugin-lifecycle-plc9c5-evidence-manifest.json PLC9C5-C5.5B-WINDOWS-LPAC-NATIVE .artifacts/plc9c5-c55b-windows-lpac-native.xml

      - name: Upload PLC9C5 C5.5b Windows LPAC native report
        if: always() && matrix.os == 'windows-2022'
        uses: actions/upload-artifact@v4
        with:
          name: plc9c5-c55b-windows-lpac-native-pytest-report
          path: .artifacts/plc9c5-c55b-windows-lpac-native.xml
          if-no-files-found: error

      - name: PLC9C5 C5.5c Windows Product composition gate
        if: matrix.os == 'windows-2022'
        env:
          LOUSHANG_PLC9C5_C55C_REPORT: "1"
          PYTEST_ADDOPTS: >-
            -o faulthandler_timeout=60
            --junitxml=.artifacts/plc9c5-c55c-windows-product.xml
        run: >-
          uv run --extra dev python scripts/dev/run_pytest.py
          tests/harness/worker/test_coding_product_worker_windows_canary.py
          -q

      - name: Reject skipped, failing, or incomplete PLC9C5 C5.5c evidence
        if: matrix.os == 'windows-2022'
        run: |
          uv run python scripts/dev/verify_pytest_xml.py .artifacts/plc9c5-c55c-windows-product.xml
          uv run python scripts/dev/verify_plc9c5_manifest.py docs/internals/architecture/harness/plugin/plugin-lifecycle-plc9c5-evidence-manifest.json PLC9C5-C5.5C-WINDOWS-PRODUCT .artifacts/plc9c5-c55c-windows-product.xml

      - name: Upload PLC9C5 C5.5c Windows Product report
        if: always() && matrix.os == 'windows-2022'
        uses: actions/upload-artifact@v4
        with:
          name: plc9c5-c55c-windows-product-pytest-report
          path: .artifacts/plc9c5-c55c-windows-product.xml
          if-no-files-found: error

      - name: Test Hosting H0-H6 contract
        env:
          LOUSHANG_HOSTING_EXPECTED_BACKEND: ${{ matrix.backend }}
          LOUSHANG_HOSTING_EXPECTED_ENDPOINT: ${{ matrix.endpoint }}
        run: >-
          uv run --extra dev python scripts/dev/run_pytest.py
          tests/hosting
          tests/harness/workspace/process/test_hosting_compat.py
          tests/harness/worker/test_hosting_adapter.py
          tests/architecture/test_hosting_h0_contract.py
          tests/architecture/test_hosting_h1_process_lifetime.py
          tests/architecture/test_hosting_h2_platform_contract.py
          tests/architecture/test_hosting_h3_endpoint.py
          tests/architecture/test_hosting_h4_child_session.py
          tests/architecture/test_hosting_h5_worker_adapter.py
          tests/architecture/test_hosting_h6_launch_preparation.py
          tests/architecture/test_hosting_h6_harness_parity.py
          tests/architecture/test_hosting_h6_posix_native.py
          tests/architecture/test_hosting_h6_windows_native.py
          tests/architecture/test_hosted_product_runtime_v1_baseline.py
          tests/architecture/test_plugin_lifecycle_plc9c5_c50_baseline.py
          tests/architecture/test_plugin_lifecycle_plc9c5_c52_linux_native.py
          tests/architecture/test_plugin_lifecycle_plc9c5_c53_windows_mechanics.py
          tests/architecture/test_plugin_lifecycle_plc9c5_c55_windows_containment.py
          tests/architecture/test_hosting_h65_windows_lpac_design.py
          tests/architecture/test_hosting_architecture_baseline.py
          -q

  worker-p4-ordinary:
    if: ${{ fromJSON(inputs.plan).checks.hosting }}
    name: Worker P4 ordinary Coding Session (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run installed Product ordinary Session gate
        env:
          PYTHONUNBUFFERED: "1"
          PYTEST_ADDOPTS: >-
            -o faulthandler_timeout=60
            --junitxml=.artifacts/worker-p4-ordinary.xml
        run: |
          mkdir -p .artifacts
          uv run --extra dev python scripts/dev/run_pytest.py \
            tests/coding/test_package_worker_candidate_wheel.py::test_explicit_worker_public_coding_session_reaches_installed_product \
            tests/coding/test_package_worker_candidate_wheel.py::test_explicit_worker_public_coding_session_disable_fences_pinned_product \
            tests/coding/test_package_worker_candidate_wheel.py::test_explicit_worker_public_coding_session_update_fences_pinned_product \
            tests/coding/test_package_worker_candidate_wheel.py::test_explicit_worker_hosted_first_session_reaches_installed_product \
            -m 'not live' \
            -vv

      - name: Reject empty, skipped, or failing P4 ordinary report
        run: >-
          uv run python scripts/dev/verify_pytest_xml.py
          .artifacts/worker-p4-ordinary.xml
          --require-tests-count 4

      - name: Upload P4 ordinary pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-p4-ordinary-pytest-report
          path: .artifacts/worker-p4-ordinary.xml
          if-no-files-found: error

  worker-sustained:
    if: ${{ fromJSON(inputs.plan).checks.hosting }}
    name: Worker sustained Product query (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run 2049 Product queries
        env:
          LOUSHANG_WORKER_SUSTAINED: "1"
          PYTEST_ADDOPTS: --junitxml=.artifacts/worker-sustained.xml
        run: |
          mkdir -p .artifacts
          uv run --extra dev python scripts/dev/run_pytest.py \
            tests/coding/test_package_worker_candidate_wheel.py::test_worker_source_catalog_sustained_product_queries \
            -q

      - name: Reject empty, skipped, or failing sustained report
        run: uv run python scripts/dev/verify_pytest_xml.py .artifacts/worker-sustained.xml

      - name: Upload sustained report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-sustained-pytest-report
          path: .artifacts/worker-sustained.xml
          if-no-files-found: error

  selected-checks:
    name: Selected checks
    if: always()
    needs: [hosting-quality, worker-p4-ordinary, worker-sustained]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify selected jobs
        env:
          CI_PLAN: ${{ inputs.plan }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: >-
          python scripts/ci/verify_gate.py
          --jobs '{"hosting-quality":"hosting","worker-p4-ordinary":"hosting","worker-sustained":"hosting"}'
