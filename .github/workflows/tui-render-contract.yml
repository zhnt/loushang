name: TUI Cross-platform Contracts

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read

env:
  PYTEST_ADDOPTS: "-o faulthandler_timeout=60"

jobs:
  tui-unit:
    if: ${{ fromJSON(inputs.plan).checks.tui_unit }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --extra dev
      - run: uv run python scripts/ci/run_checks.py tui_unit

  deterministic-render:
    if: ${{ fromJSON(inputs.plan).checks.tui_playback }}
    name: deterministic-render (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Create report directory
        run: uv run python -c "from pathlib import Path; Path('.artifacts').mkdir(exist_ok=True)"

      - name: Deterministic render and playback contracts
        run: >-
          uv run python scripts/dev/run_pytest.py tests/tui tests/harnesstui tests/coding
          -m tui_render_contract --strict-markers --strict-config
          --junitxml=.artifacts/deterministic-render.xml -q

      - name: Reject empty, skipped, or failing report
        run: uv run python scripts/dev/verify_pytest_xml.py .artifacts/deterministic-render.xml

  terminal-platform-unit:
    if: ${{ fromJSON(inputs.plan).checks.tui_native }}
    name: terminal-platform-unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Create report directory
        run: uv run python -c "from pathlib import Path; Path('.artifacts').mkdir(exist_ok=True)"

      - name: Shared terminal platform units
        run: >-
          uv run python scripts/run_tui_platform_tests.py shared
          --junitxml=.artifacts/terminal-platform-shared.xml -q

      - name: Reject empty, skipped, or failing shared report
        run: uv run python scripts/dev/verify_pytest_xml.py .artifacts/terminal-platform-shared.xml

      - name: POSIX terminal platform units
        if: runner.os == 'Linux'
        run: >-
          uv run python scripts/run_tui_platform_tests.py posix
          --junitxml=.artifacts/terminal-platform-posix.xml -q

      - name: Reject empty, skipped, or failing POSIX report
        if: runner.os == 'Linux'
        run: uv run python scripts/dev/verify_pytest_xml.py .artifacts/terminal-platform-posix.xml

      - name: Windows terminal platform units
        if: runner.os == 'Windows'
        run: >-
          uv run python scripts/run_tui_platform_tests.py windows
          --junitxml=.artifacts/terminal-platform-windows.xml -q

      - name: Reject empty, skipped, or failing Windows report
        if: runner.os == 'Windows'
        run: uv run python scripts/dev/verify_pytest_xml.py .artifacts/terminal-platform-windows.xml

  native-terminal:
    if: ${{ fromJSON(inputs.plan).checks.tui_native }}
    name: native-terminal (${{ matrix.backend }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            backend: posix-pty
            profile: posix
          - os: windows-2022
            backend: conpty
            profile: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Create report directory
        run: uv run python -c "from pathlib import Path; Path('.artifacts').mkdir(exist_ok=True)"

      - name: Native backend conformance and shared CLI contract
        env:
          LOUSHANG_REQUIRED_TERMINAL_BACKEND: ${{ matrix.backend }}
        run: >-
          uv run python scripts/run_tui_native_tests.py ${{ matrix.profile }}
          --junitxml=.artifacts/native-terminal.xml -q

      - name: Reject empty, skipped, failing, or wrong-backend report
        run: >-
          uv run python scripts/dev/verify_pytest_xml.py
          .artifacts/native-terminal.xml
          --require-property terminal_backend=${{ matrix.backend }}

  tmux-scrollback:
    if: ${{ fromJSON(inputs.plan).checks.tui_native }}
    name: tmux-scrollback (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5

      - name: Install tmux
        run: |
          sudo apt-get update
          sudo apt-get install --yes tmux
          tmux -V

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Create report directory
        run: uv run python -c "from pathlib import Path; Path('.artifacts').mkdir(exist_ok=True)"

      - name: Required tmux pane and history contracts
        env:
          LOUSHANG_REQUIRE_TMUX: "1"
        run: >-
          uv run python scripts/dev/run_pytest.py tests/coding/test_screen_coding_tui_pty_smoke.py
          -m tui_tmux_integration --strict-markers --strict-config
          --junitxml=.artifacts/tmux-scrollback.xml -q

      - name: Reject empty, skipped, or failing report
        run: uv run python scripts/dev/verify_pytest_xml.py .artifacts/tmux-scrollback.xml

  selected-checks:
    name: Selected checks
    if: always()
    needs: [tui-unit, deterministic-render, terminal-platform-unit, native-terminal, tmux-scrollback]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify selected jobs
        env:
          CI_PLAN: ${{ inputs.plan }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: >-
          python scripts/ci/verify_gate.py
          --jobs '{"tui-unit":"tui_unit","deterministic-render":"tui_playback","terminal-platform-unit":"tui_native","native-terminal":"tui_native","tmux-scrollback":"tui_native"}'
