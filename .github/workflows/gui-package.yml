name: Build Full Package
run-name: Build ${{ inputs.target }} from ${{ inputs.source_ref }}

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or commit to package
        type: string
        required: true
        default: lane/gui
      target:
        description: Full package target
        type: choice
        required: true
        options:
          - linux-x86_64-deb
          - linux-aarch64-deb
          - linux-x86_64-rpm
          - linux-aarch64-rpm
          - windows-x86_64-nsis
          - windows-x86_64-msi
          - windows-aarch64-nsis
          - windows-aarch64-msi
          - macos-x86_64-pkg
          - macos-aarch64-pkg
          - all

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.matrix.outputs.sha }}
      include: ${{ steps.matrix.outputs.include }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - name: Resolve source and native build targets
        id: matrix
        env:
          PACKAGE_TARGET: ${{ inputs.target }}
        run: |
          test -f scripts/build/build_full_linux.py || {
            echo "::error::Select a source revision that contains scripts/build."
            exit 1
          }
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import json
          import os

          runners = {
              "linux-x86_64-deb": "ubuntu-24.04",
              "linux-aarch64-deb": "ubuntu-24.04-arm",
              "linux-x86_64-rpm": "ubuntu-24.04",
              "linux-aarch64-rpm": "ubuntu-24.04-arm",
              "windows-x86_64-nsis": "windows-2022",
              "windows-x86_64-msi": "windows-2022",
              "windows-aarch64-nsis": "windows-11-arm",
              "windows-aarch64-msi": "windows-11-arm",
              "macos-x86_64-pkg": "macos-15-intel",
              "macos-aarch64-pkg": "macos-15",
          }
          selected = os.environ["PACKAGE_TARGET"]
          targets = runners if selected == "all" else [selected]
          if selected == "all":
              targets = [target for target in targets if not target.startswith("windows-")]
              for arch in ("x86_64", "aarch64"):
                  target = f"windows-{arch}-all"
                  targets.append(target)
                  runners[target] = runners[f"windows-{arch}-nsis"]
          entries = []
          for target in targets:
              system, arch, format = target.split("-")
              entries.append(dict(target=target, runner=runners[target], system=system,
                                  arch=arch, format=format))
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print("include=" + json.dumps(entries), file=output)
          PY

  package:
    needs: resolve
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.include) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: gui/.node-version
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - run: npm install --global npm@11
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: rustup toolchain install 1.98.1 --profile minimal
        if: matrix.system != 'windows' || matrix.arch != 'aarch64'
      - name: Probe native Windows ARM64 package prerequisites
        if: matrix.system == 'windows' && matrix.arch == 'aarch64'
        shell: pwsh
        timeout-minutes: 10
        run: |
          $evidence = (New-Item -ItemType Directory -Force dist/package-evidence).FullName
          & pwsh -NoProfile -File ./scripts/build/internal/check_windows_arm64.ps1 -Evidence $evidence *>&1 |
            Tee-Object "$evidence/arm64-preflight.log"
          exit $LASTEXITCODE
      - name: Install Ubuntu build dependencies
        if: matrix.format == 'deb'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential desktop-file-utils dpkg-dev file \
            libayatana-appindicator3-dev libssl-dev librsvg2-dev libwebkit2gtk-4.1-dev \
            libxdo-dev pkg-config xdg-utils xauth xdotool xvfb
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            gui/src-tauri -> target
            gui/web -> target
          key: ${{ matrix.system }}-${{ matrix.arch }}${{ matrix.format == 'rpm' && '-fedora43' || '' }}
          cache-on-failure: true
      - name: Build and test RPM on Fedora 43
        if: matrix.format == 'rpm'
        run: bash scripts/build/internal/check_fedora_full.sh ${{ matrix.arch }} "${{ needs.resolve.outputs.sha }}"
      - name: Build Full installer
        if: matrix.format != 'rpm'
        shell: bash
        run: |
          mkdir -p dist/package-evidence
          uv run --no-project --python 3.11 python scripts/build/build_full_${{ matrix.system }}.py \
            --arch ${{ matrix.arch }} --format ${{ matrix.format }} 2>&1 | tee dist/package-evidence/build.log
      - name: Install and test DEB
        if: matrix.format == 'deb'
        shell: bash
        timeout-minutes: 12
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          sudo loginctl enable-linger "$(id -un)"
          for attempt in {1..30}; do
            if systemctl --user show-environment >/dev/null 2>&1; then break; fi
            sleep 1
          done
          systemctl --user show-environment >/dev/null
          xvfb-run -a uv run --no-project --python 3.11 python scripts/gui/check_installed_unix_package.py \
            dist/packages/*.deb --arch ${{ matrix.arch }} --evidence dist/package-evidence --commit "${{ needs.resolve.outputs.sha }}" \
            2>&1 | tee dist/package-evidence/install.log
      - name: Install and test Windows installers
        if: ${{ !cancelled() && matrix.system == 'windows' && matrix.arch != 'aarch64' }}
        shell: pwsh
        timeout-minutes: 20
        run: |
          $formats = if ('${{ matrix.format }}' -eq 'all') { @('nsis', 'msi') } else { @('${{ matrix.format }}') }
          $version = uv run --no-project --python 3.11 python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $packages = @{}
          foreach ($format in $formats) {
            $pattern = if ($format -eq 'msi') { '*.msi' } else { '*-setup.exe' }
            $files = @(Get-ChildItem dist/packages -Filter $pattern -File)
            if ($files.Count -eq 1) { $packages[$format] = $files[0].FullName }
          }
          $failed = @()
          foreach ($format in $formats) {
            $evidence = (New-Item -ItemType Directory -Force "dist/package-evidence/$format").FullName
            if (-not $packages[$format]) {
              'Expected exactly one installer' | Tee-Object "$evidence/install.log"
              $failed += $format
              continue
            }
            $other = if ($format -eq 'msi') { $packages['nsis'] } else { $packages['msi'] }
            $arguments = @('-Installer', $packages[$format], '-Version', $version,
              '-Commit', '${{ needs.resolve.outputs.sha }}', '-Evidence', $evidence)
            if ($other) { $arguments += @('-OtherInstaller', $other) }
            & pwsh -NoProfile -File ./scripts/gui/check_windows_full.ps1 @arguments *>&1 |
              Tee-Object "$evidence/install.log"
            if ($LASTEXITCODE) { $failed += $format }
          }
          if ($failed.Count) { throw "Windows installer acceptance failed: $failed" }

      - name: Install and test PKG
        if: matrix.system == 'macos'
        shell: bash
        timeout-minutes: 12
        run: |
          uv run --no-project --python 3.11 python scripts/gui/check_installed_unix_package.py \
            dist/packages/*.pkg --arch ${{ matrix.arch }} --evidence dist/package-evidence --commit "${{ needs.resolve.outputs.sha }}" \
            2>&1 | tee dist/package-evidence/install.log
      - uses: actions/upload-artifact@v4
        if: always() && matrix.system != 'windows'
        with:
          name: loushang-${{ matrix.target }}-${{ needs.resolve.outputs.sha }}
          path: |
            dist/packages/
            dist/package-evidence/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always() && matrix.system == 'windows' && (matrix.format == 'nsis' || matrix.format == 'all')
        with:
          name: loushang-windows-${{ matrix.arch }}-nsis-${{ needs.resolve.outputs.sha }}
          path: |
            dist/packages/*-setup.exe*
            dist/package-evidence/nsis/
            dist/package-evidence/arm64-preflight.log
            dist/package-evidence/build.log
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always() && matrix.system == 'windows' && (matrix.format == 'msi' || matrix.format == 'all')
        with:
          name: loushang-windows-${{ matrix.arch }}-msi-${{ needs.resolve.outputs.sha }}
          path: |
            dist/packages/*.msi*
            dist/package-evidence/msi/
            dist/package-evidence/arm64-preflight.log
            dist/package-evidence/build.log
          if-no-files-found: error
          retention-days: 14
