name: Package GUI
run-name: Package ${{ inputs.platform }} from ${{ inputs.source_ref }}

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Package target
        type: choice
        required: true
        options:
          - linux-amd64-deb
          - windows-x64-nsis
          - macos-x64-pkg
      source_ref:
        description: Branch, tag, or commit to package
        type: string
        required: true
        default: main

permissions:
  contents: read

jobs:
  package:
    runs-on: >-
      ${{ fromJSON('{"linux-amd64-deb":"ubuntu-24.04","windows-x64-nsis":"windows-2022","macos-x64-pkg":"macos-15-intel"}')[inputs.platform] }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - name: Record source commit
        id: source
        shell: bash
        run: |
          sha=$(git rev-parse HEAD)
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version-file: gui/.node-version
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - run: npm install --global npm@11
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Prepare Python and Rust
        run: |
          uv python install 3.11.15
          rustup toolchain install 1.98.1 --profile minimal

      - name: Install Ubuntu build dependencies
        if: inputs.platform == 'linux-amd64-deb'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential dpkg-dev file libayatana-appindicator3-dev \
            libssl-dev librsvg2-dev libwebkit2gtk-4.1-dev libxdo-dev xdg-utils
      - name: Build and verify Debian package
        if: inputs.platform == 'linux-amd64-deb'
        shell: bash
        run: |
          npm --prefix gui ci
          npm --prefix gui run build
          uv run --no-project --python 3.11 python scripts/gui/build_linux_deb.py --output dist/gui-package
          uv run --no-project --python 3.11 python scripts/gui/check_deb_package.py dist/gui-package/*.deb

      - name: Build Windows NSIS installer
        if: inputs.platform == 'windows-x64-nsis'
        shell: pwsh
        run: |
          uv run --no-project --python 3.11 python scripts/gui/build_windows_full.py --output dist/gui-package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $packages = @(Get-ChildItem dist/gui-package -File -Filter '*.exe')
          if ($packages.Count -ne 1) { throw 'Expected exactly one NSIS installer' }
          $package = $packages[0]
          $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $package.FullName).Hash.ToLowerInvariant()
          "$digest  $($package.Name)" | Set-Content -LiteralPath "$($package.FullName).sha256" -Encoding ascii

      - name: Build macOS Intel installer
        if: inputs.platform == 'macos-x64-pkg'
        shell: bash
        run: |
          rustup target add --toolchain 1.98.1 x86_64-apple-darwin
          uv run --no-project --python 3.11 python scripts/gui/build_macos_full.py --output dist/gui-package

      - uses: actions/upload-artifact@v4
        with:
          name: loushang-${{ inputs.platform }}-${{ steps.source.outputs.sha }}
          path: dist/gui-package/
          if-no-files-found: error
          retention-days: 14
