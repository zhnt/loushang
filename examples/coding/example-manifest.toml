[meta]
schema_version = "1.0"
default_compaction_reserve_tokens = 256
default_compaction_keep_recent_tokens = 256

[profiles.coding_primary]
provider = "kimi-code"
endpoint = "kimi-code-anthropic"
model = "kimi-for-coding"

[profiles.coding_tooling]
provider = "kimi-code"
endpoint = "kimi-code-anthropic"
model = "kimi-for-coding"

[profiles.openai_frontier]
provider = "openai"
endpoint = "openai-responses"
model = "gpt-5"

[profiles.alt_cn]
provider = "dashscope"
endpoint = "openai-responses"
model = "qwen3.6-plus"

